<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma surpresa para você 🎁</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .gift {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #ddd;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 35px 0;
    }

    .time-box {
      background: #222;
      border-radius: 14px;
      padding: 15px 5px;
    }

    .number {
      display: block;
      font-size: 28px;
      font-weight: bold;
    }

    .label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .waiting {
      color: #aaa;
      font-size: 15px;
    }

    #birthday {
      display: none;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 26px;
      }

      .countdown {
        gap: 6px;
      }

      .number {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="waiting">

    <div class="gift">🎁</div>

    <h1>Biaa, eu preparei algo pra você.</h1>

    <p>
      Mas dessa vez você vai ter que esperar até meia-noite...
    </p>

    <div class="countdown">

      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">dias</span>
      </div>

      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">horas</span>
      </div>

      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">minutos</span>
      </div>

      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">segundos</span>
      </div>

    </div>

    <p class="waiting">
      🔒 Seu presente ainda está fechado.
    </p>

  </div>

  <div class="container" id="birthday">

    <div class="gift">🎂</div>

    <h1>Feliz aniversário, Bia! ❤️</h1>

    <p>
      Agora sim. Seu presente está pronto.
    </p>

    <p>
      🎥 O vídeo estará aqui.
    </p>

  </div>


  <script>

    // 27 de setembro de 2026 às 00:00 no horário de Brasília
    const targetDate = new Date("2026-09-27T00:00:00-03:00").getTime();

    function updateCountdown() {

      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {

        document.getElementById("waiting").style.display = "none";
        document.getElementById("birthday").style.display = "block";

        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
